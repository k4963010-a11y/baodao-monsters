<style>
.auth{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.92);display:flex;align-items:center;justify-content:center;padding:16px}
.auth-card{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-game);color:var(--ink)}
.auth-card h1{margin:0;font-size:28px;font-weight:normal;letter-spacing:.1em;color:#f8d040;text-align:center;text-shadow:2px 2px 0 #a02828}
.auth-card .sub{margin:0;text-align:center;color:var(--muted);font-size:13px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.auth-tabs button{font-family:inherit;font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:#18203a;color:var(--muted);cursor:pointer}
.auth-tabs button.on{background:var(--shell-dk);color:#fff;border-color:var(--shell)}
.auth-card label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.auth-card input{font-family:inherit;font-size:17px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1426;color:var(--ink)}
.auth-card .go{font-family:inherit;font-size:17px;padding:10px;border:0;border-radius:8px;background:#c7334c;color:#fff;cursor:pointer;margin-top:4px}
.auth-card .go:disabled{opacity:.6}
.auth-card .msg{margin:0;min-height:1.2em;color:#ff8a8a;font-size:13px;text-align:center}
.auth-card .hint{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.auth-card .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-family:inherit;font-size:13px;cursor:pointer}
.card.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:14px}
.card.acct button{font-family:var(--f-game);font-size:13px;padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:#18203a;color:var(--ink);cursor:pointer}
</style>
<div id="auth" class="auth">
  <form id="authForm" class="auth-card" novalidate>
    <h1>飽島怪獸</h1>
    <p class="sub">線上版・和朋友一起冒險</p>
    <div class="auth-tabs"><button type="button" data-m="login" class="on">登入</button><button type="button" data-m="reg">註冊新帳號</button></div>
    <label>帳號<input id="au" maxlength="10" autocomplete="username" placeholder="中文、英文、數字都可以"></label>
    <label>密碼<input id="ap" type="password" autocomplete="current-password" placeholder="至少 6 個字"></label>
    <label id="ap2w" hidden>再輸入一次密碼<input id="ap2" type="password" autocomplete="new-password"></label>
    <label id="aicw" hidden>邀請碼<input id="aic" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="向凱凱拿邀請碼"></label>
    <button id="ago" class="go" type="submit">登入</button>
    <p id="amsg" class="msg" role="alert"></p>
    <p id="ahint" class="hint" hidden>帳號最多 10 個字。密碼請自己記好，忘記的話要請管理員幫忙重設。</p>
    <button type="button" id="aoff" class="link">先不登入，單機玩</button>
  </form>
</div>
<script>
/* 連不上 Firebase（網路不穩、被擋）時不要卡在開場：12 秒後給「重新整理」和「單機玩」 */
(function(){setTimeout(function(){if(window.__fbOK)return;var a=document.getElementById('auth'),m=document.getElementById('amsg'),g=document.getElementById('ago'),o=document.getElementById('aoff');
  if(a)a.hidden=false;if(m)m.textContent=window.__fbLoaded?'連線很慢，伺服器一直沒有回應……':'連不上伺服器（可能是網路不穩）。';
  if(g){g.textContent='重新整理再試一次';g.disabled=false;g.onclick=function(e){e.preventDefault();location.reload()}}
  if(o){o.textContent='先不登入，單機玩（不會存到雲端）';o.onclick=function(){if(a)a.hidden=true;if(window.__resolveCloud)window.__resolveCloud(null)}}},12000)})();
</script>
<script type="module">
import {initializeApp} from './vendor/fb10122/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from './vendor/fb10122/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot,runTransaction,getDocs,query,where,orderBy,limit} from './vendor/fb10122/firebase-firestore.js';
import {getDatabase,ref,set,onValue,onDisconnect,remove,serverTimestamp,push as rpush,onChildAdded} from './vendor/fb10122/firebase-database.js';
import CONFIG from './firebase-config.js';
window.__fbLoaded=1;

const $=id=>document.getElementById(id);
const authEl=$('auth'),form=$('authForm');
let mode='login',done=false;
const finish=v=>{if(done)return;done=true;authEl.hidden=true;window.__resolveCloud(v)};
const NEED_INV=false; // 改 true 就恢復要邀請碼
const INV=new Set(["f9c10dd2f6176a09a0a758d7", "24d44fcef66c0471865b1cfd", "3f0e4a4d5e3268a0d62f99dd", "d74f4fc27457dc168a60e345", "f016be5baac232f11e4b0d59", "eb1f0fd0ccfc318b2adf13dd", "7e4ea8ae3cf1c9c333d58672", "a134bc75300e3a1742efd7a8", "d3fcdca5d5073f472af2b41e", "3ecf18f91cddd097681496ff", "520ff332c48ff6a532ede5b3", "90f37a24a9ef20883e369e0b", "a7a3632d211faa7f17917523", "3f776bccbf2a001a0d03a88e", "958de4337c8f4d58b4db2716", "4bc2e8a0824b3d5e65905be0", "0bae19055b180233f138234c", "90ea92db8ecd492433d6176b", "cf46c44aeab48770637612e8", "825094a994e884b128beda4f", "187dd4d5252a3d14b3d701f8", "456a8a28732fa0c76f658d3a", "15f26b60965c63a69729fc01", "bf29b092f97af8733697f568", "561a86a8c7baf10a85f39de0", "dc613190bb70247c7d5955c3", "843ad9615c72df406c83de70", "e90332f7308b542a3fc990fd", "39f69d8398abe26c4a241061", "1758a0b928c5c42b858a1c3b", "d2e8bd1b5eb7d8acfea961aa", "ce01c1a116f51ed0a785aa7e", "924d79b26b6d888bdb7f388f", "5bf9efa3b43e52dcd94097e7", "1100660db8a39af7f15839c1", "c31542732cd7c88cdc09e0e8", "da52fb90ed72ab25d3bb6539", "9792ffa35d2df96deab214b6", "8da20043c9f32a35b8c14380", "b8cae2d5a06746a8b8ca0149"]);
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24);
const toEmail=u=>'u'+[...new TextEncoder().encode(u.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('')+'@baodao-monsters.game';
const ERR={'auth/email-already-in-use':'這個帳號已經有人用了，換一個吧！','auth/invalid-credential':'帳號或密碼不對喔。','auth/wrong-password':'帳號或密碼不對喔。','auth/user-not-found':'帳號或密碼不對喔。','auth/invalid-email':'帳號格式不對。','auth/weak-password':'密碼至少要 6 個字。','auth/too-many-requests':'試太多次了，等一下再試。','auth/network-request-failed':'連不上網路，檢查一下網路。'};

document.querySelectorAll('.auth-tabs button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.m;document.querySelectorAll('.auth-tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('ap2w').hidden=$('ahint').hidden=mode!=='reg';$('aicw').hidden=!NEED_INV||mode!=='reg';$('ago').textContent=mode==='reg'?'註冊並開始':'登入';$('ap').autocomplete=mode==='reg'?'new-password':'current-password';$('amsg').textContent=''}));
$('aoff').addEventListener('click',()=>finish(null));

let app,auth,fs;
const CFG=CONFIG&&{...CONFIG,databaseURL:'https://baodao-monsters-default-rtdb.asia-southeast1.firebasedatabase.app'};
try{if(!CFG||!CFG.apiKey)throw new Error('no config');app=initializeApp(CFG);auth=getAuth(app);fs=getFirestore(app)}
catch(e){$('amsg').textContent='線上功能還沒設定好，目前只能單機玩。';$('ago').disabled=true}

function makeDb(){return {
  doc(path){const r=doc(fs,path);return {
    async get(){const s=await getDoc(r);return {exists:s.exists(),data:()=>s.data()}},
    set:v=>setDoc(r,v),delete:()=>deleteDoc(r),
    acquire({holder,ttlMs}){const L=doc(fs,'locks',path.replace(/\//g,'_'));return runTransaction(fs,async tx=>{const s=await tx.get(L);const now=Date.now();
      if(s.exists()){const d=s.data();if(d.exp>now&&d.holder!==holder)return {acquired:false}}tx.set(L,{holder,exp:now+ttlMs});return {acquired:true}})}}},
  query(name,o={}){const parts=[];(o.where||[]).forEach(w=>parts.push(where(w[0],w[1],w[2])));if(o.orderBy)parts.push(orderBy(o.orderBy[0],o.orderBy[1]||'asc'));if(o.limit)parts.push(limit(o.limit));
    const q=query(collection(fs,name),...parts);const wrap=s=>({metadata:{fromCache:s.metadata.fromCache},docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))});
    return {onSnapshot:(cb,err)=>onSnapshot(q,s=>cb(wrap(s)),err),get:async()=>wrap(await getDocs(q))}},
  collection(name){return {onSnapshot(cb,err){return onSnapshot(collection(fs,name),s=>cb({metadata:{fromCache:s.metadata.fromCache},docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)},async get(){const s=await getDocs(collection(fs,name));return {docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}}}}}}
function makeRoom(uid){let mine={},all={},off=0;const cbs=[];const rdb=getDatabase(app);const me=ref(rdb,'pos/'+uid);
  onValue(ref(rdb,'.info/serverTimeOffset'),s=>{off=+s.val()||0},()=>{});
  onDisconnect(me).remove().catch(()=>{});
  const push=()=>set(me,{...mine,uid,t:serverTimestamp()}).catch(e=>console.warn('pos',e));
  setInterval(()=>{if(mine.name)push()},30000);
  addEventListener('pagehide',()=>{remove(me).catch(()=>{})});
  onValue(ref(rdb,'pos'),s=>{all=s.val()||{};cbs.forEach(f=>f())},()=>{});
  setInterval(()=>cbs.forEach(f=>f()),20000);
  const dcb=[];const inbox=ref(rdb,'inbox/'+uid);remove(inbox).catch(()=>{});
  onChildAdded(inbox,s=>{const v=s.val();remove(s.ref).catch(()=>{});if(v&&typeof v==='object')dcb.forEach(f=>{try{f(v)}catch(e){console.error(e)}})},()=>{});
  const duel={send:(to,msg)=>rpush(ref(rdb,'inbox/'+to),{...msg,from:uid,t:serverTimestamp()}).catch(e=>console.warn('duel',e)),on:f=>{dcb.push(f)}};
  return {duel,presence:async p=>{mine={...mine,...p};await push()},peers:()=>Object.values(all).filter(d=>d&&typeof d==='object'&&Date.now()+off-(d.t||0)<90000).map(d=>({presence:d})),onPeers:f=>{cbs.push(f);return ()=>{}}}}

function guardSession(user){const rdb=getDatabase(app);const sid=Math.random().toString(36).slice(2)+Date.now().toString(36);const R=ref(rdb,'session/'+user.uid);
  set(R,{sid,t:serverTimestamp()}).then(()=>{onValue(R,async s=>{const v=s.val();if(v&&v.sid&&v.sid!==sid){try{sessionStorage.setItem('baodao_kicked','1')}catch(e){}try{await signOut(auth)}catch(e){}location.reload()}},()=>{})}).catch(()=>{})}
function enter(user,name){guardSession(user);$('acctName').textContent='帳號：'+(name||'已登入');$('logoutBtn').hidden=false;
  try{localStorage.setItem('baodao_acct_'+user.uid,name||'')}catch(e){}
  finish({db:makeDb(),uid:user.uid,room:makeRoom(user.uid)})}
$('logoutBtn').addEventListener('click',async()=>{try{await signOut(auth)}catch(e){}location.reload()});

if(auth){
  let first=true;
  onAuthStateChanged(auth,u=>{window.__fbOK=1;if(!first)return;first=false;
    if(u){let nm='';try{nm=localStorage.getItem('baodao_acct_'+u.uid)||''}catch(e){}enter(u,nm)}
    else{authEl.hidden=false;try{if(sessionStorage.getItem('baodao_kicked')){sessionStorage.removeItem('baodao_kicked');$('amsg').textContent='你的帳號已在另一台裝置登入，這裡先登出了。'}}catch(e){}setTimeout(()=>$('au').focus(),50)}});
  form.addEventListener('submit',async e=>{e.preventDefault();const u=$('au').value.trim(),p=$('ap').value;const msg=$('amsg');
    if(!u){msg.textContent='請輸入帳號。';return}if(p.length<6){msg.textContent='密碼至少要 6 個字。';return}
    if(mode==='reg'&&p!==$('ap2').value){msg.textContent='兩次密碼不一樣喔。';return}
    let ic='',ih='';if(mode==='reg'){ic=$('aic').value.trim().toUpperCase().replace(/\s+/g,'');ih=ic?await sha(ic):'';if(!NEED_INV)ic=ih='';else if(!INV.has(ih)){msg.textContent='邀請碼不正確，請向凱凱拿邀請碼喔。';return}}
    $('ago').disabled=true;msg.textContent=mode==='reg'?'註冊中……':'登入中……';
    try{const c=mode==='reg'?await createUserWithEmailAndPassword(auth,toEmail(u),p):await signInWithEmailAndPassword(auth,toEmail(u),p);
      if(mode==='reg'&&ih){const L=doc(fs,'invites','inv_'+ih);let used=false;
        try{await runTransaction(fs,async tx=>{const d=await tx.get(L);if(d.exists()&&d.data().usedBy&&d.data().usedBy!==c.user.uid){used=true;return}tx.set(L,{code:ic,usedBy:c.user.uid,user:u,at:Date.now()})})}catch(e2){}
        if(used){try{await c.user.delete()}catch(e3){}msg.textContent='這個邀請碼已經有人用過了，請向凱凱拿新的。';$('ago').disabled=false;return}}
      msg.textContent='';enter(c.user,u)}
    catch(err){msg.textContent=ERR[err.code]||('出了點問題：'+(err.code||err.message));$('ago').disabled=false}});
}
</script>
