<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>夜市寶貝賓果</title>
<link rel="icon" href="favicon.png">
<style>
:root{--bg:#2a0f3a;--board:#8a2bb0;--cell:#fff7e6;--gold:#ffd84a}
html,body{margin:0;background:var(--bg);color:#fff;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(circle at 50% -10%,#6a2a8a,var(--bg) 60%);min-height:100vh;min-height:100dvh}
.wrap{max-width:420px;margin:0 auto;padding:10px 12px 24px;box-sizing:border-box}
h1{margin:4px 0 2px;font-size:24px;text-align:center;color:var(--gold);text-shadow:2px 2px 0 #b03020}
.sub{text-align:center;font-size:12px;opacity:.85}
.bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px;gap:4px;white-space:nowrap}
.pill{background:#0005;border-radius:999px;padding:4px 10px}
.board{max-width:320px;margin:0 auto;background:var(--board);border-radius:12px;padding:6px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;box-shadow:0 4px 0 #4a1060}
.cell{position:relative;background:var(--cell);border-radius:6px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cell img{width:92%;image-rendering:pixelated;opacity:.55;filter:grayscale(.3)}
.cell.on img{opacity:1;filter:none}
.cell.on{background:#ffe9a8;box-shadow:inset 0 0 0 3px #f0a020}
.cell.on::after{content:'';position:absolute;inset:10%;border:3px solid #e03030;border-radius:50%;opacity:.75}
.cell.win{background:#ff7a7a;animation:pulse .5s infinite alternate}
.cell.ting{box-shadow:inset 0 0 0 3px #3ad0ff}
@keyframes pulse{to{transform:scale(.9)}}
.msg{min-height:44px;text-align:center;font-size:17px;font-weight:bold;margin:8px 0;display:flex;align-items:center;justify-content:center}
.deck{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.card{aspect-ratio:3/4;border-radius:6px;background:linear-gradient(135deg,#3ad0ff,#1a7ad0);border:2px solid #fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;transition:transform .25s}
.card.up{background:var(--cell);cursor:default}
.card.up img{width:90%;image-rendering:pixelated}
.card.gone{visibility:hidden}
.card:not(.up):active{transform:scale(.9)}
button.b{font:inherit;font-size:18px;padding:12px;border-radius:12px;border:0;background:var(--gold);color:#432;font-weight:bold;width:100%;margin-top:8px;cursor:pointer}
button.b.s{background:#ccc;font-size:14px;padding:8px}
button.b:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.box{background:#3a1650;border:3px solid var(--gold);border-radius:16px;padding:16px;max-width:360px;width:100%;text-align:center}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pk{background:#fff2;border-radius:10px;padding:6px;font-size:13px;cursor:pointer}
.pk img{width:100%;image-rendering:pixelated}
.rules{font-size:12px;opacity:.85;line-height:1.6;margin-top:10px}
.table{position:relative;height:250px;overflow:hidden;transition:height .4s,opacity .4s;background:#1e3a2a;border-radius:14px;box-shadow:inset 0 0 0 4px #3a2010,inset 0 0 30px #0008;transition:opacity .4s}
.table.dim{opacity:.3;pointer-events:none;height:60px}
.tile{position:absolute;width:40px;height:52px;border-radius:6px;background:linear-gradient(160deg,#5ad8ff,#1a7ad0);box-shadow:0 4px 0 #f2f2f2,0 6px 3px #0007;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tile:active{filter:brightness(1.2)}
.hand .tile{position:static;transform:none}
.tile.up{background:var(--cell);box-shadow:0 4px 0 #1a7ad0,0 6px 3px #0007;cursor:default}
.tile.up img{width:94%;image-rendering:pixelated}
.tile.fly{position:fixed;z-index:50;transition:transform .4s ease-in,opacity .4s;pointer-events:none}
.handT{font-size:12px;opacity:.8;margin:10px 0 4px}
.hand{display:flex;flex-wrap:wrap;gap:6px 5px;min-height:58px;background:#0003;border-radius:10px;padding:6px}
</style></head><body>
<div class="wrap">
  <h1>🀄 夜市寶貝賓果</h1>
  <div class="sub">中壢夜市・試玩版（錢是假的，不會影響遊戲存檔）</div>
  <div class="bar"><span class="pill" id="money"></span><span class="pill" id="streak"></span><span class="pill" id="price"></span></div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div class="table" id="table"></div>
  <div class="handT">手上的牌</div>
  <div class="hand" id="hand"></div>
  <button class="b" id="bGo">開始一局</button>
  <button class="b s" id="bReset">試玩重來（錢和紀錄歸零）</button>
  <div class="rules">玩法：36 張寶貝牌亂亂蓋在桌上，先隨意選 13 張，其餘捨棄；再一張一張翻開，翻到的寶貝放上板子圈起來。橫、直、斜連成一條 6 格就贏！只差 1 格叫「聽牌」，可以再補翻 4 張。<br>贏了送超大娃娃「媽祖魚寶」！連勝 2 次還可以另外換一隻稀有寶貝（只能換一次）。</div>
</div>
<div class="ov" id="ov" hidden><div class="box" id="ovBox"></div></div>
<script>
'use strict';
// ===== 設定（改這裡就好）=====
const MONS=[[1,'閃紋虎'],[3,'啾啾鵲'],[5,'茶苞苞'],[6,'火金姑'],[7,'鮭寶寶'],[8,'穿山球'],[9,'小月熊'],[11,'皮皮猴'],[13,'招手蟹'],[14,'硫晶球'],[15,'日光妹'],[17,'蛋願寶寶'],
  [19,'茶葉精'],[21,'螢火郎'],[23,'櫻花鮭'],[26,'霧紋豹'],[27,'葉鼻蝠'],[29,'冠羽鷲'],[30,'芒絨球'],[32,'松靈鼠'],[33,'霓虹喵'],[36,'竹節忍'],[37,'寬尾鳳靈'],[38,'夜影貓'],
  [39,'轉轉輪'],[41,'阻尼球'],[49,'刺刺陽'],[52,'水燈靈'],[53,'月影鴞'],[54,'嘟鼻象'],[55,'五彩叩叩'],[56,'隱竹蜥'],[61,'包種蛙'],[65,'幽燈狸'],[66,'稻浪鴨'],[68,'龜島靈']];
const RARE_CHOICES=[[26,'霧紋豹'],[49,'刺刺陽'],[52,'水燈靈'],[53,'月影鴞'],[68,'龜島靈'],[72,'閃線鰻']];
const DRAW=13,EXTRA=4,STREAK_FOR_RARE=2;  // 選13張、聽牌補4張 → 勝率約 5.3%
const PRICE=2000,PRIZE_MON='媽祖魚寶',PRIZE_IMG='mon/mazu_f.webp',START_MONEY=60000;  // 贏了送大娃娃媽祖魚寶（不給錢）
const LINES=[];for(let r=0;r<6;r++)LINES.push([0,1,2,3,4,5].map(c=>r*6+c));for(let c=0;c<6;c++)LINES.push([0,1,2,3,4,5].map(r=>r*6+c));
LINES.push([0,7,14,21,28,35],[5,10,15,20,25,30]);

const $=id=>document.getElementById(id);
let S;try{S=JSON.parse(localStorage.getItem('bingo_trial'))}catch(e){}
if(!S)S={money:START_MONEY,streak:0,rare:0,games:0,wins:0};
const save=()=>{try{localStorage.setItem('bingo_trial',JSON.stringify(S))}catch(e){}};
let G=null; // 這一局
let AC=null;function snd(f,d=.1,t='square',v=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const price=()=>PRICE;
function hud(){$('money').textContent='💰 '+S.money.toLocaleString()+' 元';$('streak').textContent='🔥 連勝 '+S.streak+'・🐬×'+(S.dolls|0);$('price').textContent=`一局 ${price()} 元`}
function drawBoard(){$('board').innerHTML=MONS.map(([id,n],i)=>`<div class="cell" id="c${i}"><img src="mon/${id}_f.webp" alt="${n}"></div>`).join('')}
// ===== 牌桌：蓋著的牌亂亂堆 → 選 15 張 → 其餘捨棄 → 一張一張翻開放上板子 =====
function msg(t){$('msg').innerHTML=t}
function lineCount(L){return L.filter(i=>G.hit.has(i)).length}
function layTable(){const T=$('table');T.innerHTML='';const W=T.clientWidth,H=T.clientHeight,tw=40,th=52;
  const order=MONS.map((m,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
  order.forEach((mi,k)=>{const gx=k%6,gy=k/6|0,cw=(W-tw)/5,ch=(H-th)/5;
    const x=gx*cw+(Math.random()-.5)*cw*.8,y=gy*ch+(Math.random()-.5)*ch*.8,r=(Math.random()-.5)*80;
    const t=document.createElement('div');t.className='tile';t.dataset.m=mi;t.style.left=clamp(x,0,W-tw)+'px';t.style.top=clamp(y,0,H-th)+'px';t.style.transform=`rotate(${r}deg)`;t.style.zIndex=1+(Math.random()*30|0);T.appendChild(t)});
  G.pile=[...T.children]}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function start(){if(S.money<price()){msg('錢不夠了～按「試玩重來」');return}
  S.money-=price();S.games++;save();
  G={hit:new Set(),need:DRAW,phase:'pick',hand:[],done:false,flipping:false};
  drawBoard();$('hand').innerHTML='';$('table').classList.remove('dim');layTable();hud();$('bGo').disabled=true;
  msg(`隨意選 <b style="color:var(--gold)">&nbsp;${DRAW}&nbsp;</b> 張牌`);snd(660,.08)}
function pick(t){if(!G||G.done||G.need<=0||(G.phase!=='pick'&&G.phase!=='pick2')||t.classList.contains('out'))return;
  t.remove();t.className='tile';t.style.cssText='';$('hand').appendChild(t);G.hand.push(t);G.need--;snd(520+Math.random()*80,.05);
  if(G.need>0){msg(`還要選 <b style="color:var(--gold)">&nbsp;${G.need}&nbsp;</b> 張`);return}
  // 選夠了：剩下的捨棄（推到旁邊變暗），開始一張一張翻
  $('table').classList.add('dim');G.phase='reveal';msg('一張一張翻開！點手上的牌 👇');snd(880,.12,'triangle')}
function reveal(t){if(!G||G.done||G.phase!=='reveal'||G.flipping||t.classList.contains('up'))return;
  const i=+t.dataset.m,[id]=MONS[i];t.classList.add('up');t.innerHTML=`<img src="mon/${id}_f.webp">`;G.flipping=true;
  // 從手上飛到板子上
  const a=t.getBoundingClientRect(),cell=$('c'+i),b=cell.getBoundingClientRect(),f=t.cloneNode(true);f.classList.add('fly');
  Object.assign(f.style,{left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px'});document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.transform=`translate(${b.left-a.left+(b.width-a.width)/2}px,${b.top-a.top+(b.height-a.height)/2}px) scale(1.2)`;f.style.opacity='.2'});
  setTimeout(()=>{f.remove();G.flipping=false;placed(i)},420)}
function placed(i){if(!G||G.done)return;G.hit.add(i);$('c'+i).classList.add('on');snd(880+Math.random()*200,.06);
  document.querySelectorAll('.cell.ting').forEach(c=>c.classList.remove('ting'));
  const win=LINES.find(L=>lineCount(L)===6);if(win){end(true,win);return}
  const tingL=LINES.filter(L=>lineCount(L)===5);tingL.forEach(L=>L.forEach(j=>{if(!G.hit.has(j))$('c'+j).classList.add('ting')}));
  const left=G.hand.filter(t=>!t.classList.contains('up')).length;
  if(left>0){msg(`${tingL.length?'🔔 聽牌了！':''}還有 <b style="color:var(--gold)">&nbsp;${left}&nbsp;</b> 張沒翻`);return}
  if(!G.extra&&tingL.length){G.extra=true;G.phase='pick2';G.need=EXTRA;$('table').classList.remove('dim');msg(`🔔 聽牌！從剩下的牌再補 <b style="color:var(--gold)">&nbsp;${EXTRA}&nbsp;</b> 張`);snd(1200,.2,'triangle');return}
  end(false)}
function end(won,line){G.done=true;$('bGo').disabled=false;$('table').classList.add('dim');
  if(won){line.forEach(i=>$('c'+i).classList.add('win'));S.dolls=(S.dolls|0)+1;S.streak++;S.wins++;save();hud();
    [880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>snd(f,.18,'triangle'),i*120));
    msg(`🎉 連線了！獲得大娃娃 ${PRIZE_MON}！`);$('ovBox').innerHTML=`<h1>🎉 大獎！</h1><img src="${PRIZE_IMG}" style="width:170px"><div style="margin:8px 0;font-size:18px">獲得超大娃娃 <b>${PRIZE_MON}</b>！</div><div class="sub">（試玩版：正式版會直接放進你的隊伍）</div><button class="b" id="bOk">好</button>`;$('ov').hidden=false;
    if(!S.rare&&S.streak>=STREAK_FOR_RARE)setTimeout(rareShop,1500)}
  else{S.streak=0;save();hud();snd(200,.3,'sawtooth');msg('沒連線…再來一局！')}
  $('bGo').textContent=`再玩一局（${price()} 元）`}
function rareShop(){$('ovBox').innerHTML=`<h1>🏆 連勝 ${STREAK_FOR_RARE} 次！</h1><div>選一隻稀有寶貝帶回家（只能換一次）</div>
  <div class="picks">${RARE_CHOICES.map(([id,n])=>`<div class="pk" data-id="${id}" data-n="${n}"><img src="mon/${id}_f.webp">${n}</div>`).join('')}</div>`;$('ov').hidden=false}
$('ovBox').addEventListener('click',e=>{const p=e.target.closest('.pk');if(p){S.rare=+p.dataset.id;save();hud();
    $('ovBox').innerHTML=`<h1>✨ 換到 ${p.dataset.n}！</h1><img src="mon/${p.dataset.id}_f.webp" style="width:140px;image-rendering:pixelated"><div style="margin:8px 0">（試玩版：正式版會直接放進你的隊伍）</div><button class="b" id="bOk">好</button>`;
    [660,880,1320].forEach((f,i)=>setTimeout(()=>snd(f,.2,'triangle'),i*150));$('bGo').textContent=`再玩一局（${price()} 元）`;return}
  if(e.target.id==='bOk')$('ov').hidden=true});
$('table').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)pick(t)});
$('hand').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)reveal(t)});
$('bGo').onclick=start;
$('bReset').onclick=()=>{if(!confirm('試玩的錢和紀錄都歸零？'))return;S={money:START_MONEY,streak:0,rare:0,games:0,wins:0};save();G=null;drawBoard();$('table').innerHTML='';$('hand').innerHTML='';hud();msg('');$('bGo').disabled=false;$('bGo').textContent='開始一局'};
drawBoard();hud();if(S.rare)$('bGo').textContent=`開始一局（${price()} 元）`;
</script>
</body></html>
