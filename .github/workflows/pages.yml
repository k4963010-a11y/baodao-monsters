name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html auth.html firebase-config.js version.json .nojekyll apple-touch-icon.png favicon.png icon-192.png icon-512.png manifest.webmanifest dex.html race.html bingo.html _site/
          cp -r dex _site/dex
          cp -r mon _site/mon
          cp -r trn _site/trn
          cp -r vendor _site/vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
