*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
header{padding:16px;max-width:1400px;margin:auto}
h1{margin:0 0 4px;font-size:24px}
.sub{color:var(--sub);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.bar input{flex:1;min-width:180px}
.wrap{max-width:1400px;margin:0 auto 40px;padding:0 16px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
th{position:sticky;top:0;background:var(--head);color:var(--headink);padding:8px 6px;font-weight:700;text-align:left;z-index:1;cursor:pointer;white-space:nowrap}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
tr:nth-child(even) td{background:var(--zebra)}
td.pic{width:140px;text-align:center}
td.pic img{width:128px;height:128px;border-radius:10px;background:#fff;cursor:zoom-in}
.no{color:var(--sub);font-weight:700}
.nm{font-size:18px;font-weight:700}
.desc{color:var(--sub);font-size:13px;margin-top:4px;max-width:260px}
.ty{display:inline-block;padding:2px 10px;border-radius:10px;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.rare{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;background:#c8102e;color:#fff;font-size:11px;vertical-align:middle}
.st{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;line-height:1.7}
.st b{display:inline-block;width:2.2em;color:var(--sub);font-weight:400}
.st .sum{font-weight:700;border-top:1px solid var(--line);margin-top:2px}
.evo{font-size:13px;color:var(--sub);max-width:150px}
.mv{border-collapse:collapse;border:none;background:none;width:100%;font-size:13px}
.mv td{border:none;padding:2px 6px 2px 0;background:none!important;white-space:nowrap}
.mv .lv{color:var(--sub);width:3.5em}
.mv .mn{font-weight:700}
.mv .ef{color:#c05a00}
.mv .pw{font-variant-numeric:tabular-nums;text-align:right;width:3em}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9}
#zoom img{max-width:92vw;max-height:92vh;border-radius:12px;background:#fff}

const R=DATA.rows,TC=DATA.tc,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ty=t=>t?`<span class="ty" style="background:${TC[t]||'#888'}">${esc(t)}</span>`:'';
const sum=r=>r.b.reduce((a,b)=>a+b,0);
[...new Set(R.map(r=>r.t))].forEach(t=>$('#ft').insertAdjacentHTML('beforeend',`<option>${esc(t)}</option>`));
function row(r){
 const mv=r.mv.map(m=>`<tr><td class="lv">Lv${m.lv}</td><td class="mn">${esc(m.n)}</td><td>${ty(m.t)}</td><td class="pw">${m.p||'—'}</td><td class="pw">${m.acc}%</td><td class="ef">${m.ef?esc(m.ef)+(m.ch?' '+m.ch+'%':''):''}</td></tr>`).join('');
 return `<tr><td class="pic">${r.img?`<img loading="lazy" src="${r.img}" alt="${esc(r.n)}">`:'（無圖）'}</td>
 <td><div class="no">No.${String(r.no).padStart(3,'0')}</div><div class="nm">${esc(r.n)}${r.rare?'<span class="rare">稀有</span>':''}</div><div class="desc">${esc(r.d)}</div></td>
 <td>${ty(r.t)}</td>
 <td class="st"><div><b>HP</b>${r.b[0]}</div><div><b>攻擊</b>${r.b[1]}</div><div><b>防禦</b>${r.b[2]}</div><div><b>速度</b>${r.b[3]}</div><div class="sum"><b>合計</b>${sum(r)}</div></td>
 <td class="evo">${esc(r.evo)||'—'}</td>
 <td class="mvs"><table class="mv">${mv}</table></td></tr>`}
function draw(){
 const q=$('#q').value.trim(),t=$('#ft').value,so=$('#so').value;
 let L=R.filter(r=>(!t||r.t===t)&&(!q||(r.n+r.d+r.evo+r.mv.map(m=>m.n).join()).includes(q)));
 if(so==='sum')L=[...L].sort((a,b)=>sum(b)-sum(a));else if(so==='n')L=[...L].sort((a,b)=>a.n.localeCompare(b.n,'zh-Hant'));
