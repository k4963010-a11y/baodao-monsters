<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
html,body{margin:0;height:100%;background:#2f6a2c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,28,40,.78);padding:16px;box-sizing:border-box;overflow:auto}
.ov[hidden],#itemBtn[hidden]{display:none}
h1{margin:0;font-size:32px;color:#ffd84a;text-shadow:3px 3px 0 #b03020;text-align:center}
.picks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(440px,100%)}
.pk{background:#fff2;border:3px solid transparent;border-radius:12px;padding:6px 2px;text-align:center;font-size:13px;cursor:pointer}
.pk img{width:100%;max-width:84px;image-rendering:pixelated;display:block;margin:0 auto}
.pk.on{border-color:#ffd84a;background:#ffd84a40}
button.b{font:inherit;font-size:18px;padding:12px 18px;border-radius:12px;border:0;background:#ffd84a;color:#432;font-weight:bold;width:min(320px,100%);cursor:pointer}
button.b.g{background:#6fd18a}button.b.s{background:#ccc}button.b:disabled{opacity:.4}
.row{display:flex;gap:8px;width:min(320px,100%)}
.row input{flex:1;font-size:22px;text-align:center;border-radius:12px;border:0;padding:8px;min-width:0;letter-spacing:6px}
.row button.b{width:auto}
.hint{font-size:13px;opacity:.88;text-align:center;max-width:340px;line-height:1.5}
a.hint{color:#9cf}
.slots{width:min(340px,100%);display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;background:#fff2;border-radius:10px;padding:4px 10px;min-height:48px}
.slot img{width:44px;height:44px;image-rendering:pixelated}
#code{font-size:44px;letter-spacing:10px;color:#ffd84a;font-weight:bold}
#itemBtn{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);width:86px;height:86px;border-radius:50%;border:4px solid #fff;background:#0007;font-size:46px;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
#itemBtn.empty{opacity:.35;font-size:14px}
table.res{border-collapse:collapse;font-size:17px;width:min(340px,100%)}
table.res td{padding:4px 6px}table.res img{width:40px;height:40px;image-rendering:pixelated;vertical-align:middle}
table.res tr.me{background:#ffd84a33}
</style></head><body>
<canvas id="cv"></canvas>
<div id="itemBtn" hidden class="empty">道具</div>
<div class="ov" id="menu">
  <h1>🏁 寶貝大賽車</h1>
  <div class="hint">淡水河畔・跑 3 圈<br>按住畫面<b>左邊／右邊</b>轉彎，下面圓鈕用道具</div>
  <div class="picks" id="picks"></div>
  <button class="b g" id="bSolo">單人練習（和 3 個電腦比）</button>
  <button class="b" id="bHost" disabled>開房間（找朋友一起跑）</button>
  <div class="row"><input id="inCode" inputmode="numeric" maxlength="4" placeholder="房號"><button class="b" id="bJoin" disabled>加入</button></div>
  <button class="b s" id="bBoard">🏆 排行榜（最快前 10 名）</button>
  <div class="hint" id="acct">連線中…</div>
  <a class="hint" href="./">← 回冒險遊戲</a>
</div>
<div class="ov" id="lobby" hidden>
  <div>房號</div><div id="code"></div>
  <div class="hint">把房號告訴朋友，在賽車頁輸入就能加入<br>不滿 4 人由電腦補位</div>
  <div class="slots" id="slots"></div>
  <label class="hint" id="fillW"><input type="checkbox" id="fillBots" checked> 不滿 4 人由電腦補位（不勾＝只有真人，2～4 人都能跑）</label>
  <button class="b g" id="bStart">開始比賽</button>
  <div class="hint" id="lmsg"></div>
  <button class="b s" id="bLeave">離開房間</button>
</div>
<div class="ov" id="result" hidden>
  <h1 id="rtitle">比賽結束</h1>
  <table class="res" id="rtab"></table>
  <div class="hint" id="rmsg"></div>
  <div class="hint" id="rbest" style="font-size:16px;color:#ffd84a"></div>
  <button class="b" id="bAgain">再來一場</button>
  <button class="b s" id="bQuit">回選單</button>
</div>
<div class="ov" id="boardOv" hidden>
  <h1>🏆 淡水河畔 排行榜</h1>
  <table class="res" id="boardTab"></table>
  <div class="hint" id="boardMsg"></div>
  <button class="b s" id="bBoardX">關閉</button>
</div>
<script type="module">
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angD=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));

// ===== 設定（之後加賽道/車手/道具只改這裡）=====
const RACERS=[{id:15,n:'日光妹',c:'#ff6fb0'},{id:17,n:'蛋願寶寶',c:'#ffb52e'},{id:54,n:'嘟鼻象',c:'#5f8fd8'},{id:7,n:'鮭寶寶',c:'#ff6a4a'}];
const BOTNAMES=['電腦・阿灰','電腦・小霧','電腦・黑皮'];
const ITEMS={tea:{icon:'🧋',n:'珍珠奶茶・加速'},fire:{icon:'🧨',n:'鞭炮・往前丟'},mochi:{icon:'🍡',n:'麻糬・丟在後面'},jump:{icon:'🚁',n:'竹蜻蜓・跳起來'},shield:{icon:'🧧',n:'平安符・3秒無敵'},rocket:{icon:'🚀',n:'沖天炮・追前一名'},thunder:{icon:'⛈️',n:'午後雷陣雨・前面全變小'}};
const ITEM_W=[ // 依名次 1~4（落後的人拿到強道具的機會大）
  {tea:1,fire:3,mochi:3,jump:2,shield:3,rocket:0,thunder:0},{tea:2,fire:3,mochi:2,jump:2,shield:2,rocket:2,thunder:0},
  {tea:3,fire:2,mochi:1,jump:1,shield:1,rocket:3,thunder:1},{tea:4,fire:2,mochi:1,jump:1,shield:1,rocket:3,thunder:2}];
const TS=1.25,TSC=.5,DECO=[]; // 賽道放大倍數
const TRACK={name:'淡水河畔',laps:3,w:2600*TS,h:2100*TS,rw:260,
  cp:[[1500,1820],[1000,1830],[600,1700],[380,1350],[400,950],[620,600],[1000,420],[1400,450],[1620,700],[1480,980],[1180,1080],[1120,1320],[1380,1480],[1800,1400],[2000,1100],[2150,800],[2350,700],[2450,1000],[2380,1450],[2100,1750]].map(p=>[p[0]*TS,p[1]*TS]),
  pads:[[.06,-70],[.2,60],[.33,0],[.42,-75],[.56,70],[.66,-40],[.78,45],[.92,-60]],boxes:[.13,.47,.83],river:y=>190+55*Math.sin(y/280)};
const AUTO=Q.has('local')&&Q.has('auto'),SPEED=Q.has('local')?(+Q.get('speed')||1):1;  // 測試開關只在 ?local 測試模式有效（防止刷排行榜）
const VMAX=430,STEER=2.7,SEND_MS=100,INTERP_MS=130;
const IMG={},IMGF={};RACERS.forEach(r=>{const i=new Image();i.src='mon/'+r.id+'_b.webp';IMG[r.id]=i;const f=new Image();f.src='mon/'+r.id+'_f.webp';IMGF[r.id]=f});
const RC=id=>RACERS.find(r=>r.id===id)||RACERS[0];

// ===== 賽道 =====
const T=[],TA=[];let N=0,BG=null,PADS=[],BOXES=[];
function buildTrack(){const cp=TRACK.cp,n=cp.length,raw=[];
  for(let i=0;i<n;i++){const p0=cp[(i-1+n)%n],p1=cp[i],p2=cp[(i+1)%n],p3=cp[(i+2)%n];
    for(let s=0;s<40;s++){const t=s/40,t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);raw.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])])}}
  const SP=12;let acc=0;T.push(raw[0]);
  for(let i=1;i<=raw.length;i++){let a=raw[i-1],b=raw[i%raw.length],d=Math.hypot(b[0]-a[0],b[1]-a[1]);
    while(acc+d>=SP){const t=(SP-acc)/d;a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];T.push(a);d=Math.hypot(b[0]-a[0],b[1]-a[1]);acc=0}acc+=d}
  if(Math.hypot(T[T.length-1][0]-T[0][0],T[T.length-1][1]-T[0][1])<SP*.6)T.pop();
  N=T.length;for(let i=0;i<N;i++){const a=T[(i-1+N)%N],b=T[(i+1)%N];TA.push(Math.atan2(b[1]-a[1],b[0]-a[0]))}
  PADS=TRACK.pads.map(([f,o])=>({i:Math.floor(f*N),o}));
  BOXES=[];TRACK.boxes.forEach(f=>{const k=Math.floor(f*N);[-85,0,85].forEach(o=>{const p=lat(k,o);BOXES.push({x:p[0],y:p[1],t:0})})});
  BG=drawBG();buildTex()}
function lat(i,o){const a=TA[i]+Math.PI/2;return [T[i][0]+Math.cos(a)*o,T[i][1]+Math.sin(a)*o]}
function nearest(x,y,i0){let best=0,bd=1e18;const full=i0==null||i0<0;const lo=full?0:i0-20,hi=full?N:i0+30;
  for(let k=lo;k<hi;k++){const i=(k%N+N)%N,dx=T[i][0]-x,dy=T[i][1]-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}
  if(!full&&bd>(TRACK.rw*2)**2)return nearest(x,y,null);return [best,Math.sqrt(bd)]}
function distTrack(x,y){let bd=1e18;for(let i=0;i<N;i+=2){const dx=T[i][0]-x,dy=T[i][1]-y,d=dx*dx+dy*dy;if(d<bd)bd=d}return Math.sqrt(bd)}
function rng(s){return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}}
function drawBG(){const W=TRACK.w,H=TRACK.h,rw=TRACK.rw,c=document.createElement('canvas');c.width=Math.ceil(W*TSC);c.height=Math.ceil(H*TSC);const g=c.getContext('2d',{willReadFrequently:true}),R=rng(7),RV=TRACK.river;g.scale(TSC,TSC);DECO.length=0;
  g.fillStyle='#5da34c';g.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){g.fillStyle=R()<.5?'#529843':'#6ab058';g.fillRect(R()*W|0,R()*H|0,6+R()*10|0,4)}
  // 淡水河
  g.beginPath();g.moveTo(0,0);for(let y=0;y<=H;y+=20)g.lineTo(RV(y),y);g.lineTo(0,H);g.closePath();g.fillStyle='#3a86c8';g.fill();
  g.strokeStyle='#d9c98e';g.lineWidth=16;g.beginPath();for(let y=0;y<=H;y+=20)g.lineTo(RV(y)+6,y);g.stroke();
  g.strokeStyle='#ffffff55';g.lineWidth=3;for(let i=0;i<70;i++){const y=R()*H,x=R()*(RV(y)-40)+10;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+10,y-6,x+20,y);g.stroke()}
  g.fillStyle='#ffffffcc';g.font='bold 54px "Microsoft JhengHei",sans-serif';g.textAlign='center';[...'淡水河'].forEach((ch,i)=>g.fillText(ch,RV(900)/2,880+i*66));
  // 紅樹林（河岸）
  for(let i=0;i<120;i++){const y=R()*H,x=RV(y)+18+R()*50;if(distTrack(x,y)<rw/2+25)continue;g.fillStyle=R()<.5?'#2f6e3a':'#3b7f40';g.beginPath();g.arc(x,y,10+R()*8,0,7);g.fill()}
  // 漁船
  for(let i=0;i<6;i++){const y=150+i*330,x=RV(y)/2;g.fillStyle='#fff';g.fillRect(x-22,y-8,44,16);g.fillStyle='#d33';g.fillRect(x-22,y+4,44,4);g.fillStyle='#8b5a2b';g.fillRect(x-4,y-20,4,14)}
  // 情人橋
  g.strokeStyle='#fff';g.lineWidth=10;g.beginPath();g.moveTo(RV(260)-130,250);g.quadraticCurveTo(RV(260)-60,170,RV(260)+30,250);g.stroke();
  g.fillStyle='#fff';g.font='bold 26px "Microsoft JhengHei",sans-serif';g.fillText('情人橋',RV(260)-50,300);
  // 房子、樹
  const ok=(x,y,m)=>x>RV(y)+70&&x<W-40&&y>40&&y<H-40&&distTrack(x,y)>rw/2+m;
  for(let i=0;i<800;i++){const x=R()*W,y=R()*H;if(!ok(x,y,60))continue;
    g.fillStyle='#0002';if(R()<.22){g.fillRect(x-30,y-6,60,14);DECO.push({k:'house',x,y,c:R()<.5?'#c0392b':'#a5512a'})}
    else{const r=18+R()*10;g.beginPath();g.ellipse(x,y,r,r*.4,0,0,7);g.fill();DECO.push({k:'tree',x,y,r})}}
  // 紅毛城
  const LM=[[1820,960,'紅毛城'],[820,1150,'淡水老街'],[1900,560,'真理大學']].map(([x,y,t])=>[x*TS,y*TS,t]);
  for(const [x,y,t] of LM){if(distTrack(x,y)<rw/2+90)continue;DECO.push({k:'lm',x,y,t});g.fillStyle='#b8382c';g.fillRect(x-60,y-45,120,90);g.fillStyle='#e9d6b0';for(let k=0;k<3;k++)g.fillRect(x-45+k*35,y-20,18,26);g.fillStyle='#7a2018';g.fillRect(x-66,y-56,132,16);
    g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=5;g.font='bold 28px "Microsoft JhengHei",sans-serif';g.strokeText(t,x,y+82);g.fillText(t,x,y+82)}
  // 路
  const path=()=>{g.beginPath();T.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()};
  g.lineJoin=g.lineCap='round';
  path();g.strokeStyle='#d33';g.lineWidth=rw+22;g.stroke();
  g.setLineDash([26,26]);path();g.strokeStyle='#fff';g.stroke();g.setLineDash([]);
  path();g.strokeStyle='#6c6c74';g.lineWidth=rw;g.stroke();
  for(let i=0;i<1500;i++){const k=R()*N|0,p=lat(k,(R()-.5)*rw*.95);g.fillStyle=R()<.5?'#636369':'#77777f';g.fillRect(p[0],p[1],3,3)}
  g.setLineDash([30,34]);path();g.strokeStyle='#ead36a';g.lineWidth=5;g.stroke();g.setLineDash([]);
  // 起點格子線
  {const a=TA[0],nx=Math.cos(a+Math.PI/2),ny=Math.sin(a+Math.PI/2),tx=Math.cos(a),ty=Math.sin(a),S=14;
    for(let r=0;r<2;r++)for(let k=-6;k<6;k++){g.fillStyle=(r+k)&1?'#111':'#fff';const x=T[0][0]+nx*k*S+tx*r*S,y=T[0][1]+ny*k*S+ty*r*S;
      g.save();g.translate(x,y);g.rotate(a);g.fillRect(0,0,S,S);g.restore()}}
  // 加速帶
  for(const pd of PADS){const i=(pd.i+2)%N,q=lat(i,pd.o);g.save();g.translate(q[0],q[1]);g.rotate(TA[i]);
    g.fillStyle='#ff8a00';g.fillRect(-32,-32,64,64);g.fillStyle='#ffe14a';for(let a=0;a<4;a++)for(let b=0;b<4;b++)if((a+b)&1)g.fillRect(-32+a*16,-32+b*16,16,16);
    g.strokeStyle='#fff';g.lineWidth=5;g.strokeRect(-32,-32,64,64);
    g.fillStyle='#fff';g.strokeStyle='#c04000';g.lineWidth=3;for(const dx of [-12,8]){g.beginPath();g.moveTo(dx+10,0);g.lineTo(dx-6,-18);g.lineTo(dx,-18);g.lineTo(dx+16,0);g.lineTo(dx,18);g.lineTo(dx-6,18);g.closePath();g.fill();g.stroke()}g.restore()}
  return c}

// ===== 音效 =====
let AC=null;function snd(f,d=.1,type='square',v=.08){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

// ===== 狀態 =====
let mode='menu',NET=null,ROOM=null,HOST=false,ROSTER=[],ME=null,CARS={},SHOTS=[],MOCHI=[],race=null,DEMO=false;
let PICK=+(localStorage.getItem('race_pick')||15);if(!RACERS.some(r=>r.id===PICK))PICK=RACERS[0].id;
const now=()=>NET?NET.now():Date.now();
const uidN=()=>Math.random().toString(36).slice(2,9);

function newCar(p,slot){const k=TRACK.laps,back=4+Math.floor(slot/2)*6,i=(N-back)%N,q=lat(i,slot%2?-60:60);
  return {id:p.id,name:p.name,pick:p.pick,bot:!!p.bot,x:q[0],y:q[1],a:TA[i],v:0,lap:0,idx:i,pi:i,half:true,item:null,spin:0,sa:0,boost:0,sticky:0,jump:0,shield:0,shrink:0,fin:0,
    loc:false,lane:(Math.random()-.5)*120,skill:1,buf:[],seen:now()}}
function startRace(roster,T0,amHost,demo){DEMO=!!demo;HOST=amHost;ROSTER=roster;CARS={};SHOTS=[];MOCHI=[];BOXES.forEach(b=>b.t=0);
  roster.forEach((p,s)=>{const c=newCar(p,s);c.loc=p.id===ME||(p.bot&&amHost);CARS[c.id]=c});
  race={T0,t:-9,lastSend:0,firstFin:0,done:false,go:false,cd:4};mode=demo?'menu':'race';
  ['menu','lobby','result'].forEach(id=>$(id).hidden=id!=='menu'||!demo);$('itemBtn').hidden=demo;setItemBtn()}
function soloStart(){NET=NET||null;const me={id:ME,name:myName(),pick:PICK};HOST=true;
  startRace([me,...bots([PICK])],now()+3500,true,false)}
function bots(used,n=3){const picks=RACERS.map(r=>r.id).filter(id=>!used.includes(id));const out=[];
  for(let i=0;i<n;i++)out.push({id:'bot'+i,name:BOTNAMES[i],pick:picks[i%picks.length]||RACERS[i].id,bot:true});return out}
function demoStart(){ME='bot0';startRace(bots([],4).map((b,i)=>({...b,id:'bot'+i})),now()-100,true,true)}

// ===== 物理 =====
let keys={L:0,R:0};const touches=new Map();
function inputTurn(){let t=keys.R-keys.L;for(const v of touches.values())t+=v;return clamp(t,-1,1)}
function phys(c,dt,turn,go){const [i,d]=nearest(c.x,c.y,c.idx);c.idx=i;
  if(c.pi>N*.8&&i<N*.2&&c.half){c.lap++;c.half=false;if(c.lap>TRACK.laps&&!c.fin)finish(c);else if(c.id===ME&&c.lap>1&&!c.fin)snd(880,.25,'triangle')}
  else if(c.pi<N*.2&&i>N*.8){c.lap--;c.half=true}
  if(i>N*.4&&i<N*.6)c.half=true;c.pi=i;
  let vm=go?VMAX*c.skill:0;const water=c.x<TRACK.river(c.y);c.off=d>TRACK.rw/2;
  if(c.off)vm*=water?.35:.55;
  if(c.sticky>0){c.sticky-=dt;vm*=.45}
  if(c.shrink>0){c.shrink-=dt;vm*=.6}if(c.jump>0)c.jump-=dt;if(c.shield>0)c.shield-=dt;
  for(const pd of PADS){const di=(i-pd.i+N)%N,na=TA[i]+Math.PI/2,lo=(c.x-T[i][0])*Math.cos(na)+(c.y-T[i][1])*Math.sin(na);if(di<6&&Math.abs(lo-pd.o)<36){if(c.boost<.2&&c.id===ME)snd(660,.15,'sawtooth');c.boost=Math.max(c.boost,.9)}}
  if(c.boost>0){c.boost-=dt;if(go)vm=Math.max(vm,VMAX*1.5)}
  if(c.spin>0){c.spin-=dt;c.sa+=dt*13;c.v*=Math.pow(.15,dt);if(c.spin<=0)c.sa=0}
  else if(go)c.a+=turn*STEER*dt*Math.min(1,c.v/150);
  if(c.spin<=0){if(c.v<vm)c.v=Math.min(vm,c.v+(c.boost>0?600:260)*dt);else c.v=Math.max(vm,c.v-520*dt)}
  c.x+=Math.cos(c.a)*c.v*dt;c.y+=Math.sin(c.a)*c.v*dt;
  if(d>TRACK.rw/2+230){c.x+=(T[i][0]-c.x)*.06;c.y+=(T[i][1]-c.y)*.06}
  c.x=clamp(c.x,30,TRACK.w-30);c.y=clamp(c.y,30,TRACK.h-30)}
function prog(c){return c.fin?1e9-c.fin:(c.lap-1)*N+c.idx}
function ranking(){return Object.values(CARS).sort((a,b)=>prog(b)-prog(a))}
function ai(c,dt){const L=14+Math.floor(c.v/60),k=(c.idx+L)%N,p=lat(k,c.lane);

  if(c.item&&!DEMO||c.item&&DEMO){c.ih=(c.ih||0)+dt;if(c.ih>(c.iw||2)){useItem(c);c.ih=0;c.iw=1+Math.random()*3}}
  if(c.bot){const hum=Object.values(CARS).filter(o=>!o.bot);const best=hum.length?Math.max(...hum.map(prog)):prog(c);const gap=prog(c)-best;
    c.skill=gap>N*.25?.88:gap<-N*.25?1.03:gap>0?.95:.99}

function collide(){const L=Object.values(CARS);for(const c of L){if(!c.loc)continue;for(const o of L){if(o===c||c.jump>0||o.jump>0)continue;const dx=c.x-o.x,dy=c.y-o.y,d=Math.hypot(dx,dy);

// ===== 道具 =====
function roll(c){const r=ranking().indexOf(c),w=ITEM_W[clamp(r,0,3)];let s=0;for(const k in w)s+=w[k];let x=Math.random()*s;for(const k in w){x-=w[k];if(x<0)return k}return 'tea'}
function useItem(c){const it=c.item;if(!it||c.spin>0)return;c.item=null;if(c.id===ME){setItemBtn();snd(520,.12)}
  if(it==='tea'){c.boost=1.7}
  else if(it==='fire'){const s={id:uidN(),x:c.x+Math.cos(c.a)*34,y:c.y+Math.sin(c.a)*34,a:c.a,v:c.v+430,life:1.8,own:c.id,tg:''};SHOTS.push(s);send({k:'fire',...s,t:now()})}
  else if(it==='mochi'){const m={id:uidN(),x:c.x-Math.cos(c.a)*40,y:c.y-Math.sin(c.a)*40,life:25,own:c.id};MOCHI.push(m);send({k:'mochi',...m})}
  else if(it==='jump'){c.jump=.8;if(c.id===ME)snd(700,.3,'triangle')}
  else if(it==='shield'){c.shield=3}
  else if(it==='rocket'){const R=ranking(),k=R.indexOf(c),tg=k>0?R[k-1].id:'';const s={id:uidN(),x:c.x+Math.cos(c.a)*34,y:c.y+Math.sin(c.a)*34,a:c.a,v:Math.max(c.v,VMAX)+260,life:3.2,own:c.id,tg};SHOTS.push(s);send({k:'fire',...s,t:now()})}
  else if(it==='thunder'){const R=ranking(),ids=R.slice(0,R.indexOf(c)).map(o=>o.id);zap(ids);send({k:'zap',ids})}}
function zap(ids){race.flash=.35;snd(90,.5,'sawtooth',.12);for(const id of ids){const o=CARS[id];if(o&&o.loc&&!o.fin&&o.shield<=0){o.shrink=2.5;if(o.id===ME&&navigator.vibrate)navigator.vibrate(200)}}}
function hit(c,kind){if(kind==='fire'){c.spin=1.1;c.item=c.item}else c.sticky=1.6;if(c.id===ME){snd(kind==='fire'?140:300,.35,'sawtooth',.12);if(navigator.vibrate)navigator.vibrate(120)}}
function items(dt){const L=Object.values(CARS);
  for(const b of BOXES)if(b.t>0)b.t-=dt;else for(const c of L)if(c.loc&&!c.item&&!c.fin&&Math.hypot(c.x-b.x,c.y-b.y)<30){b.t=3;c.item=roll(c);c.iw=1+Math.random()*3;send({k:'box',i:BOXES.indexOf(b)});if(c.id===ME){setItemBtn();race.toast=ITEMS[c.item].n;race.toastT=1.6;snd(990,.08);setTimeout(()=>snd(1320,.1),80)}break}
  for(const s of SHOTS){s.life-=dt;const tg=s.tg&&CARS[s.tg];if(tg&&!tg.fin){s.a+=clamp(angD(s.a,Math.atan2(tg.y-s.y,tg.x-s.x)),-4*dt,4*dt)}
    s.x+=Math.cos(s.a)*s.v*dt;s.y+=Math.sin(s.a)*s.v*dt;
    for(const c of L)if(c.loc&&(c.id!==s.own||s.life<1.5)&&c.spin<=0&&c.jump<=0&&Math.hypot(c.x-s.x,c.y-s.y)<24){if(c.shield<=0)hit(c,'fire');s.life=0;send({k:'rm',id:s.id});break}}
  for(const m of MOCHI){m.life-=dt;for(const c of L)if(c.loc&&(c.id!==m.own||m.life<24)&&c.jump<=0&&Math.hypot(c.x-m.x,c.y-m.y)<22){if(c.shield<=0)hit(c,'mochi');m.life=0;send({k:'rm',id:m.id});break}}
  SHOTS=SHOTS.filter(s=>s.life>0);MOCHI=MOCHI.filter(m=>m.life>0)}
function setItemBtn(){const c=CARS[ME],b=$('itemBtn');if(!c||!c.item){b.className='empty';b.textContent='道具'}else{b.className='';b.textContent=ITEMS[c.item].icon}}

// ===== 主迴圈 =====
function finish(c){c.fin=Math.max(1,now()-race.T0);if(!race.firstFin)race.firstFin=now();send({k:'fin',id:c.id,tm:c.fin});if(c.id===ME){snd(660,.15);setTimeout(()=>snd(880,.15),150);setTimeout(()=>snd(1320,.4),300);showResult();
  const rc=race;if(!DEMO&&NET&&NET.board)NET.board.submit(c.fin,c.pick).then(r=>{rc.best=r;if(race===rc&&mode==='result')showResult()}).catch(e=>console.warn('board',e))}}

  collide();items(dt);

function interp(c,t){const b=c.buf;if(!b.length)return;const rt=t-INTERP_MS;let s=b[b.length-1];

  if(m.k==='roster'){if(HOST)return;ROSTER=m.roster;NET.peers=ROSTER.filter(p=>p.id!==ME).map(p=>p.id);lastRoster=t;if(mode==='menu'||mode==='result'&&race&&race.done){showLobby()}renderLobby();return}

  else if(m.k==='mochi'){MOCHI.push({id:m.id,x:m.x,y:m.y,life:m.life,own:m.own})}
  else if(m.k==='rm'){SHOTS=SHOTS.filter(s=>s.id!==m.id);MOCHI=MOCHI.filter(s=>s.id!==m.id)}
  else if(m.k==='box'){if(BOXES[m.i])BOXES[m.i].t=3}
  else if(m.k==='zap'){zap(m.ids||[])}

let lastRoster=0;

// ===== 房間 =====

  $('acct').textContent='找房間中…';HOST=false;ME=NET.me;ROOM=code;lastRoster=now();
  const ok=await NET.join(code,{name:myName(),pick:PICK});if(!ok){ROOM=null;$('acct').textContent='找不到這個房間，房號對嗎？';return}
  setTimeout(()=>{if(ROOM===code&&mode==='menu'&&!ROSTER.length){$('acct').textContent='房主沒有回應，再試一次'}},6000)}

  NET.peers=humans.filter(p=>p.id!==ME).map(p=>p.id);const T0=now()+4000;NET.bc({k:'start',roster,T0});startRace(roster,T0,true,false)}

// ===== 結果 =====

  $('rtitle').textContent=r===1?'🏆 第 1 名！':`第 ${r} 名`;

// ===== 畫面（背後追尾的假 3D：地面貼圖逐行透視取樣，像老遊戲機的賽車）=====
const cv=$('cv'),ctx=cv.getContext('2d');let DPR=1;

const FOC=LW*.55,DCAM=130,ZMAX=2600;
const CAM={x:0,y:0,a:0,fx:1,fy:0,rx:0,ry:1,race:null};
const rgb=(r,g,b)=>((255<<24)|(b<<16)|(g<<8)|r)>>>0;
const GRASS=rgb(93,163,76),HAZEC=rgb(207,232,248),FARC=rgb(120,150,182),NEARC=rgb(70,128,72),SNOW=rgb(240,246,252);
let TEX=null,TW=0,TH=0,SKY=null;
function resize(){DPR=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
  LH=Math.max(120,Math.round(LW*cv.height/Math.max(1,cv.width))||120);L.width=LW;L.height=LH;LIMG=lg.createImageData(LW,LH);LBUF=new Uint32Array(LIMG.data.buffer);
  const tall=LH>LW;HZ=Math.round(LH*(tall?.28:.36));HC=(LH*(tall?.80:.86)-HZ)*DCAM/FOC;
  SKY=new Uint32Array(HZ);for(let y=0;y<HZ;y++){const t=y/HZ;SKY[y]=rgb(95+112*t|0,168+64*t|0,232+16*t|0)}}
addEventListener('resize',resize);resize();
function buildTex(){TW=BG.width;TH=BG.height;TEX=new Uint32Array(BG.getContext('2d').getImageData(0,0,TW,TH).data.buffer)}
function ground(){const b=LBUF,fx=CAM.fx,fy=CAM.fy,rx=CAM.rx,ry=CAM.ry,cx=CAM.x,cy=CAM.y,S=TSC;

    const far=HZ*(.16+.06*Math.sin(3*th+1)+.04*Math.sin(7*th)+.02*Math.sin(13*th+2)+.24*Math.max(0,1-Math.abs(angD(th,.6))*3.2));

  // 地面：每一行算出對應的世界座標，從賽道貼圖取色
  for(let y=HZ;y<LH;y++){const row=y*LW,dy=y-HZ;if(!dy){b.fill(HAZEC,row,row+LW);continue}
    const z=HC*FOC/dy;if(z>ZMAX){b.fill(HAZEC,row,row+LW);continue}
    const k=z/FOC;let wx=(cx+fx*z-rx*k*LW/2)*S,wy=(cy+fy*z-ry*k*LW/2)*S;const sx=rx*k*S,sy=ry*k*S;
    for(let x=0;x<LW;x++){const ix=wx|0,iy=wy|0;b[row+x]=(wx>=0&&wy>=0&&ix<TW&&iy<TH)?TEX[iy*TW+ix]:GRASS;wx+=sx;wy+=sy}}
  lg.putImageData(LIMG,0,0)}
function proj(x,y,zmin=40){const dx=x-CAM.x,dy=y-CAM.y,z=dx*CAM.fx+dy*CAM.fy;if(z<zmin||z>ZMAX)return null;
  const k=cv.width/LW,sx=(LW/2+(dx*CAM.rx+dy*CAM.ry)*FOC/z)*k;if(sx<-cv.width*.4||sx>cv.width*1.4)return null;return {x:sx,y:(HZ+HC*FOC/z)*k,s:FOC/z*k,z}}
function label(t,x,y,px){ctx.font=`bold ${px|0}px "Microsoft JhengHei",sans-serif`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.lineWidth=Math.max(2,px/5);ctx.strokeStyle='#000';ctx.fillStyle='#fff';ctx.strokeText(t,x,y);ctx.fillText(t,x,y)}
function drawDeco(p,d){const s=p.s;
  if(d.k==='tree'){const r=d.r*s;ctx.fillStyle='#6b4a2a';ctx.fillRect(p.x-r*.15,p.y-r*1.1,r*.3,r*1.1);ctx.fillStyle='#2e7a35';ctx.beginPath();ctx.arc(p.x,p.y-r*1.6,r,0,7);ctx.fill();ctx.fillStyle='#3f9a45';ctx.beginPath();ctx.arc(p.x-r*.3,p.y-r*1.85,r*.5,0,7);ctx.fill()}
  else if(d.k==='house'){const w=56*s,h=40*s;ctx.fillStyle='#e8dcc0';ctx.fillRect(p.x-w/2,p.y-h,w,h);ctx.fillStyle=d.c;ctx.beginPath();ctx.moveTo(p.x-w*.62,p.y-h);ctx.lineTo(p.x,p.y-h*1.6);ctx.lineTo(p.x+w*.62,p.y-h);ctx.fill();ctx.fillStyle='#7a4a2a';ctx.fillRect(p.x-w*.1,p.y-h*.5,w*.2,h*.5)}
  else{const w=140*s,h=90*s;ctx.fillStyle='#b8382c';ctx.fillRect(p.x-w/2,p.y-h,w,h);ctx.fillStyle='#7a2018';ctx.fillRect(p.x-w*.55,p.y-h*1.12,w*1.1,h*.14);ctx.fillStyle='#e9d6b0';for(let i=0;i<4;i++)ctx.fillRect(p.x-w*.4+i*w*.22,p.y-h*.7,w*.1,h*.35);
    if(s>.5)label(d.t,p.x,p.y-h*1.15,26*s)}}
function drawBox(p){const s=p.s,z=24*s,y=p.y-z*(1.5+.15*Math.sin(performance.now()/200));ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(p.x,p.y,z*.5,z*.15,0,0,7);ctx.fill();
  ctx.fillStyle='#d42020';ctx.fillRect(p.x-z/2,y,z,z);ctx.strokeStyle='#ffd84a';ctx.lineWidth=Math.max(1,3*s);ctx.strokeRect(p.x-z/2,y,z,z);
  ctx.fillStyle='#ffd84a';ctx.font=`bold ${Math.max(6,20*s)|0}px "Microsoft JhengHei",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('福',p.x,y+z/2)}
function drawMochi(p){const s=p.s*.7;ctx.fillStyle='#f6c8dc';ctx.beginPath();ctx.ellipse(p.x,p.y-4*s,18*s,9*s,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(p.x-5*s,p.y-7*s,6*s,3*s,0,0,7);ctx.fill()}
function drawShot(p,o){const s=p.s*.7;if(o.tg!==''&&o.tg!=null){const y=p.y-30*s;ctx.fillStyle='#fff';ctx.fillRect(p.x-6*s,y-10*s,12*s,22*s);ctx.fillStyle='#d42020';ctx.beginPath();ctx.moveTo(p.x-6*s,y-10*s);ctx.lineTo(p.x,y-22*s);ctx.lineTo(p.x+6*s,y-10*s);ctx.fill();ctx.fillStyle=Math.random()<.5?'#ffcc33':'#ff6a1a';ctx.beginPath();ctx.ellipse(p.x,y+16*s,5*s,(6+Math.random()*6)*s,0,0,7);ctx.fill();return}ctx.fillStyle='#c81e1e';ctx.fillRect(p.x-12*s,p.y-22*s,24*s,12*s);ctx.fillStyle='#ffd84a';ctx.fillRect(p.x-12*s,p.y-18*s,24*s,4*s);ctx.fillStyle=Math.random()<.5?'#fff':'#ffcc33';ctx.beginPath();ctx.arc(p.x,p.y-26*s,(4+Math.random()*4)*s,0,7);ctx.fill()}
function drawKart(p,c){let s=p.s*.5;if(c.shrink>0)s*=.55;const hj=c.jump>0?(c.loc?Math.sin(Math.PI*clamp(1-c.jump/.8,0,1)):.8)*60*s:0;ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,0,30*s*(1-hj/(200*s)),9*s,0,0,7);ctx.fill();ctx.translate(0,-hj);
  if(c.id===ME&&!c.fin&&!DEMO)ctx.rotate(inputTurn()*.1);if(c.sa)ctx.rotate(Math.sin(c.sa)*.6);
  if(c.jump>0){ctx.fillStyle='#c8a050';ctx.fillRect(-2*s,-96*s,4*s,22*s);const r=performance.now()/40;ctx.fillRect(-24*s*Math.abs(Math.cos(r)),-98*s,48*s*Math.abs(Math.cos(r)),5*s)}
  if(c.boost>0){ctx.fillStyle=Math.random()<.5?'#ffcc33':'#ff6a1a';ctx.beginPath();ctx.ellipse(0,-4*s,10*s,(8+Math.random()*8)*s,0,0,7);ctx.fill()}
  ctx.fillStyle='#222';ctx.fillRect(-27*s,-12*s,10*s,12*s);ctx.fillRect(17*s,-12*s,10*s,12*s);
  ctx.fillStyle=RC(c.pick).c;ctx.fillRect(-20*s,-19*s,40*s,15*s);ctx.fillStyle='#fff8';ctx.fillRect(-14*s,-17*s,28*s,3*s);
  const im=(Math.abs(angD(CAM.a,c.a))<1.9?IMG:IMGF)[c.pick];if(im&&im.complete)ctx.drawImage(im,-32*s,-74*s,64*s,64*s);
  if(c.sticky>0){ctx.fillStyle='#ffd1e6';for(const [x,y] of [[-14,-10],[12,-8],[0,-4]]){ctx.beginPath();ctx.arc(x*s,y*s,7*s,0,7);ctx.fill()}}
  ctx.restore();
  if(c.spin>0||c.sa){ctx.fillStyle='#ffe14a';ctx.font=`${Math.max(8,18*s)|0}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';for(let k=0;k<3;k++){const a=performance.now()/150+k*2.1;ctx.fillText('★',p.x+Math.cos(a)*30*s,p.y-80*s+Math.sin(a)*8*s)}}
  if(c.shield>0){ctx.fillStyle='rgba(255,215,80,.22)';ctx.strokeStyle=`rgba(255,200,40,${.6+.3*Math.sin(performance.now()/90)})`;ctx.lineWidth=Math.max(2,4*s);ctx.beginPath();ctx.arc(p.x,p.y-40*s-hj,50*s,0,7);ctx.fill();ctx.stroke()}
  if(c.shrink>0){ctx.fillStyle='#ffe14a';ctx.font=`${Math.max(10,40*s)|0}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText('⚡',p.x,p.y-90*s-hj)}
  if(c.id!==ME&&s>.12)label(c.name,p.x,p.y-80*s-hj,13*DPR)}
function render(){const w=cv.width,h=cv.height;ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;
  const me=race&&CARS[ME];if(!me||!TEX){ctx.fillStyle='#5da34c';ctx.fillRect(0,0,w,h);return}
  if(CAM.race!==race){CAM.race=race;CAM.a=me.a}else CAM.a+=angD(CAM.a,me.a)*.15;
  CAM.fx=Math.cos(CAM.a);CAM.fy=Math.sin(CAM.a);CAM.rx=-CAM.fy;CAM.ry=CAM.fx;CAM.x=me.x-CAM.fx*DCAM;CAM.y=me.y-CAM.fy*DCAM;
  ground();ctx.drawImage(L,0,0,w,h);
  const k=w/LW,gz=ctx.createLinearGradient(0,HZ*k,0,(HZ+LH*.07)*k);gz.addColorStop(0,'rgba(207,232,248,.95)');gz.addColorStop(1,'rgba(207,232,248,0)');ctx.fillStyle=gz;ctx.fillRect(0,HZ*k,w,LH*.07*k);
  const list=[],add=(x,y,f,o,zm)=>{const p=proj(x,y,zm);if(p)list.push([p,f,o])};
  for(const d of DECO)add(d.x,d.y,drawDeco,d,100);
  for(const b of BOXES)if(b.t<=0)add(b.x,b.y,drawBox,b);
  for(const m of MOCHI)add(m.x,m.y,drawMochi,m);
  for(const s of SHOTS)add(s.x,s.y,drawShot,s);
  for(const c of Object.values(CARS))add(c.x,c.y,drawKart,c);
  list.sort((a,b)=>b[0].z-a[0].z);for(const [p,f,o] of list)f(p,o);
  ctx.setTransform(DPR,0,0,DPR,0,0);hud();
  if(race.flash>0){ctx.fillStyle=`rgba(255,255,230,${Math.min(.7,race.flash*2)})`;ctx.fillRect(0,0,innerWidth,innerHeight);race.flash-=1/60}
  if(race.toastT>0&&!DEMO){race.toastT-=1/60;ctx.font='bold 22px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.fillStyle='#fff';ctx.strokeText(race.toast,innerWidth/2,innerHeight*.62);ctx.fillText(race.toast,innerWidth/2,innerHeight*.62)}}
function hud(){if(DEMO)return;const W=innerWidth,H=innerHeight,me=CARS[ME],R=ranking(),r=R.indexOf(me)+1;
  const out=(t,x,y,f,col,al)=>{ctx.font=f;ctx.textAlign=al||'left';ctx.textBaseline='top';ctx.lineWidth=5;ctx.strokeStyle='#000';ctx.fillStyle=col;ctx.strokeText(t,x,y);ctx.fillText(t,x,y)};
  const tm=me.fin?me.fin/1000:Math.max(0,race.t);
  out(`${Math.floor(tm/60)}'${String(Math.floor(tm%60)).padStart(2,'0')}"${String(Math.floor(tm*100)%100).padStart(2,'0')}`,12,12,'bold 24px system-ui,sans-serif','#fff');
  out(`圈 ${clamp(me.lap,1,TRACK.laps)}/${TRACK.laps}`,12,44,'bold 20px system-ui,sans-serif','#fff');
  out('第'+r+'名',W-12,10,'bold 38px system-ui,sans-serif','#ffd84a','right');
  const mw=96,ms=mw/TRACK.w,mx=W-mw-12,my=60;ctx.fillStyle='#0006';ctx.fillRect(mx-6,my-6,mw+12,TRACK.h*ms+12);
  ctx.strokeStyle='#ddd';ctx.lineWidth=3;ctx.beginPath();T.forEach((p,i)=>i?ctx.lineTo(mx+p[0]*ms,my+p[1]*ms):ctx.moveTo(mx+p[0]*ms,my+p[1]*ms));ctx.closePath();ctx.stroke();
  for(const c of R){ctx.fillStyle=RC(c.pick).c;ctx.beginPath();ctx.arc(mx+c.x*ms,my+c.y*ms,c.id===ME?5:3.5,0,7);ctx.fill();if(c.id===ME){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
  // 起跑紅綠燈
  if(race.t<1.2&&race.t>-3.8){const t=race.t,lx=W/2-22,ly=H*.06;ctx.fillStyle='#222';ctx.fillRect(lx,ly,44,128);ctx.fillRect(lx+19,ly+128,6,30);
    const n=t<0?clamp(Math.floor(t+4),0,3):0;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(lx+22,ly+22+i*42,15,0,7);ctx.fillStyle=t>=0?'#3f3':(i<n?'#f33':'#422');ctx.fill()}
    if(t>=0)out('出發！',W/2,ly+168,'bold 46px system-ui,sans-serif','#ffd84a','center')}
  if(me.lap===TRACK.laps&&!me.fin&&me.idx<N*.1)out('最後一圈！',W/2,H*.2,'bold 30px system-ui,sans-serif','#ff5a5a','center')}
let last=performance.now(),acc=0;
function loop(ts){requestAnimationFrame(loop);frame(ts)}
if(Q.has('local'))setInterval(()=>frame(performance.now()),20);
function frame(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;if(race){acc+=dt*SPEED;while(acc>=1/60){tick(1/60);acc-=1/60}}render()}

// ===== 操作 =====
const tz=e=>{for(const t of e.changedTouches)touches.set(t.identifier,t.clientX<innerWidth/2?-1:1)};
cv.addEventListener('touchstart',e=>{e.preventDefault();tz(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();tz(e)},{passive:false});
['touchend','touchcancel'].forEach(n=>cv.addEventListener(n,e=>{for(const t of e.changedTouches)touches.delete(t.identifier)}));
cv.addEventListener('mousedown',e=>touches.set('m',e.clientX<innerWidth/2?-1:1));addEventListener('mouseup',()=>touches.delete('m'));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.L=1;if(e.key==='ArrowRight'||e.key==='d')keys.R=1;if(e.key===' '&&mode==='race'&&CARS[ME])useItem(CARS[ME])});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.L=0;if(e.key==='ArrowRight'||e.key==='d')keys.R=0});
$('itemBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='race'&&race&&race.go&&CARS[ME])useItem(CARS[ME])});
function renderPicks(){$('picks').innerHTML=RACERS.map(r=>`<div class="pk${r.id===PICK?' on':''}" data-id="${r.id}"><img src="mon/${r.id}_f.webp">${r.n}</div>`).join('')}
$('picks').addEventListener('click',e=>{const d=e.target.closest('.pk');if(!d)return;PICK=+d.dataset.id;try{localStorage.setItem('race_pick',PICK)}catch(e){}renderPicks();snd(660,.06)});
$('bSolo').onclick=()=>{ME=NET?NET.me:'me';ROOM=null;soloStart()};
$('bHost').onclick=()=>{if(NET)hostRoom()};
$('bJoin').onclick=()=>{if(NET)joinRoom()};
$('bStart').onclick=()=>{if(HOST)hostStart()};
$('bLeave').onclick=()=>leaveRoom();
async function showBoard(){$('boardOv').hidden=false;$('boardTab').innerHTML='';
  if(!NET||!NET.board){$('boardMsg').textContent='登入冒險遊戲後才看得到排行榜';return}$('boardMsg').textContent='讀取中…';
  try{const L=await NET.board.top();$('boardTab').innerHTML=L.map((d,i)=>`<tr class="${d.uid===(NET&&NET.me)?'me':''}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td><img src="mon/${RC(d.pick|0).id}_f.webp"></td><td>${esc(d.name||'玩家')}</td><td>${fmt(d.raceMs)}</td></tr>`).join('');
    $('boardMsg').textContent=L.length?'跑完 3 圈的時間，越快越前面':'還沒有人跑完，快來當第一名！'}catch(e){console.warn(e);$('boardMsg').textContent='讀取失敗，等一下再試'}}
$('bBoard').onclick=showBoard;$('bBoardX').onclick=()=>$('boardOv').hidden=true;
$('bAgain').onclick=()=>{if(ROOM&&HOST){ROSTER=ROSTER.filter(p=>!p.bot);showLobby();lobbySync()}else if(!ROOM)$('bSolo').onclick()};
$('bQuit').onclick=()=>{if(ROOM)leaveRoom();else toMenu()};

// ===== 開始 =====
if(Q.has('local'))window.__give=k=>{const c=CARS[ME];c.item=k;setItemBtn();useItem(c);return [c.jump,c.shield,SHOTS.length]};
if(Q.has('local'))window.__dbg=()=>({mode,N,ME,t:race&&race.t,cars:Object.values(CARS).map(c=>[c.id,c.lap,c.idx,c.fin,c.x|0,c.y|0,c.v|0,c.item])});
buildTrack();renderPicks();demoStart();requestAnimationFrame(loop);
(async()=>{try{NET=Q.has('local')?localNet():await fbNet()}catch(e){console.warn(e);NET=null}
  if(NET){NET.on(onMsg);$('bHost').disabled=$('bJoin').disabled=false;$('acct').textContent='帳號：'+NET.name+'（可以開房間找朋友）'}
  else $('acct').textContent='還沒登入：只能單人練習（先到冒險遊戲登入，再回來就能找朋友）'})();
</script>
